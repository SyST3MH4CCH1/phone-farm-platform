<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phone Farm Control Center — Flask</title>
<style>
  :root {
    --bg: #1e1e1e; --panel: #252526; --border: #3c3c3c;
    --text: #d4d4d4; --dim: #858585; --accent: #00e5be; --blue: #38bdf8;
    --red: #f87171; --green: #4ade80; --yellow: #facc15;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; }
  .mono { font-family: Consolas, 'Cascadia Mono', monospace; }

  header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 16px;
    padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-size: 15px; font-weight: 700; letter-spacing: .5px; color: #fff; }
  header h1 span { color: var(--accent); }
  .pills { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; }
  .pill {
    background: #2d2d2d; border: 1px solid var(--border); border-radius: 6px;
    padding: 4px 10px; font-size: 11px; display: flex; gap: 6px; align-items: center;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot.ok { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .dot.bad { background: var(--red); box-shadow: 0 0 6px var(--red); }
  .dot.mid { background: var(--yellow); box-shadow: 0 0 6px var(--yellow); }

  main { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px 20px; }
  @media (max-width: 1200px) { main { grid-template-columns: 1fr; } }

  section { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  section h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--dim);
    padding: 10px 14px; border-bottom: 1px solid var(--border); background: #2a2a2b;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  section h2 .count { color: var(--blue); }
  .body { padding: 12px 14px; }

  .accounts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
  .acct {
    border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; background: #2d2d2d;
  }
  .acct .row { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
  .acct .uname { font-weight: 600; color: #fff; }
  .acct .meta { color: var(--dim); font-size: 11px; }
  .acct .meta b { color: var(--text); font-weight: 500; }
  .badge { font-size: 10px; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--border); }
  .badge.active { color: var(--green); border-color: var(--green); }
  .badge.warmup { color: var(--yellow); border-color: var(--yellow); }
  .badge.error, .badge.failed { color: var(--red); border-color: var(--red); }
  .badge.pending { color: var(--dim); }
  .badge.published, .badge.publishing { color: var(--blue); border-color: var(--blue); }
  .acct .actions { margin-top: 8px; display: flex; gap: 6px; }
  .btn {
    background: #3d3d3d; border: 1px solid var(--border); color: var(--text);
    padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 12px;
  }
  .btn:hover { background: #4a4a4a; }
  .btn.primary { background: #0e7490; border-color: #0e7490; color: #fff; }
  .btn.primary:hover { background: #0a5e75; }
  .btn.start { background: #065f46; border-color: var(--green); color: var(--green); }
  .btn.stop { background: #7f1d1d; border-color: var(--red); color: var(--red); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  .queue-form { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .queue-form input, .queue-form select {
    background: #1e1e1e; border: 1px solid var(--border); color: var(--text);
    padding: 6px 10px; border-radius: 6px; font-size: 12px; flex: 1; min-width: 160px;
  }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--dim); font-weight: 500; text-transform: uppercase; font-size: 10px; letter-spacing: .5px; }
  tr:hover td { background: #2a2a2b; }
  .progress { height: 6px; background: #1e1e1e; border-radius: 3px; overflow: hidden; min-width: 70px; }
  .progress > div { height: 100%; background: var(--accent); transition: width .4s; }
  .video-thumb video { width: 64px; height: 112px; object-fit: cover; border-radius: 4px; display: block; }

  .console {
    grid-column: 1 / -1; font-family: Consolas, monospace; background: #1a1a1a;
    height: 260px; overflow-y: auto; padding: 10px 14px; font-size: 12px; line-height: 1.5;
    white-space: pre-wrap; word-break: break-all;
  }
  .console .INFO { color: var(--text); }
  .console .WARNING { color: var(--yellow); }
  .console .ERROR { color: var(--red); }
  .console .DEBUG { color: var(--dim); }

  .toast {
    position: fixed; bottom: 20px; right: 20px; background: #065f46; color: #fff;
    padding: 10px 16px; border-radius: 6px; font-size: 12px; opacity: 0;
    transition: opacity .3s; pointer-events: none; z-index: 100;
  }
  .toast.err { background: #7f1d1d; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <h1>PHONE FARM <span>CONTROL CENTER</span> <small style="color:var(--dim);font-size:10px">Flask API</small></h1>
  <div class="pills">
    <span class="pill"><span id="dotPanda" class="dot ok"></span> Panda Grid <b id="panda">—</b></span>
    <span class="pill">🛜 Proxies <b id="proxies">—</b></span>
    <span class="pill">🧠 CPU <b id="cpu">—</b></span>
    <span class="pill">💾 RAM <b id="ram">—</b></span>
    <span class="pill">🤖 Bots <b id="bots">—</b></span>
    <span class="pill">🎬 Subidos <b id="published">—</b></span>
  </div>
</header>

<main>
  <!-- Cuentas & Dispositivos -->
  <section>
    <h2>Cuentas &amp; Dispositivos <span class="count" id="acctCount">0</span></h2>
    <div class="body accounts-grid" id="accountsGrid"></div>
  </section>

  <!-- Cola de Contenidos -->
  <section>
    <h2>Cola de Contenidos <span class="count" id="queueCount">0</span></h2>
    <div class="body">
      <div class="queue-form">
        <input id="kwInput" placeholder="Keyword / nicho (ej: decoracion sala minimalista)" />
        <select id="acctSelect"></select>
        <button class="btn primary" onclick="addJob()">Agregar Keyword</button>
      </div>
      <table>
        <thead><tr><th>ID</th><th>Keyword</th><th>Cuenta</th><th>Estado</th><th>Progreso</th><th>Vídeo</th></tr></thead>
        <tbody id="queueBody"></tbody>
      </table>
      <div style="margin-top:12px;display:flex;justify-content:flex-end">
        <button class="btn start" onclick="processNext()">▶ Generar y Publicar Siguiente</button>
      </div>
    </div>
  </section>

  <!-- Consola de logs (SSE) -->
  <section class="console" id="console"></section>
</main>

<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
let accounts = [];
let queue = [];

function toast(msg, err = false) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show' + (err ? ' err' : '');
  setTimeout(() => t.className = 'toast', 2500);
}

async function api(path, opts = {}) {
  const res = await fetch(path, {
    headers: { 'Content-Type': 'application/json' },
    ...opts
  });
  if (!res.ok) {
    const data = await res.json().catch(() => ({}));
    throw new Error(data.error || `HTTP ${res.status}`);
  }
  return res.json();
}

// --- Indicadores en vivo (5 s) ---
async function refreshStats() {
  try {
    const s = await api('/api/stats');
    $('panda').textContent = s.panda_grid_status;
    $('dotPanda').className = 'dot ' + (s.panda_grid_status === 'Connected' ? 'ok' : 'mid');
    $('proxies').textContent = s.active_proxies;
    $('cpu').textContent = s.cpu_percent + '%';
    $('ram').textContent = s.ram_percent + '%';
    $('bots').textContent = s.active_bots;
    $('published').textContent = s.videos_subidos;
  } catch (e) { /* primer arranque */ }
}

async function refreshAccounts() {
  try {
    accounts = await api('/api/accounts');
    $('acctCount').textContent = accounts.length;
    const sel = $('acctSelect');
    const prev = sel.value;
    sel.innerHTML = accounts.map(a => `<option value="${a.id}">${a.username} (${a.id})</option>`).join('');
    if (prev) sel.value = prev;

    $('accountsGrid').innerHTML = accounts.map(a => {
      const statusCls = a.status === 'active' ? 'active' : (a.status === 'warmup' ? 'warmup' : 'error');
      const botBtn = a.bot_active
        ? `<button class="btn stop" onclick="toggleBot('${a.id}', false)">⏹ Stop</button>`
        : `<button class="btn start" onclick="toggleBot('${a.id}', true)">▶ Start</button>`;
      return `
      <div class="acct">
        <div class="row"><span class="uname">@${a.username}</span><span class="badge ${statusCls}">${a.status}</span></div>
        <div class="row meta"><span>📱 <b>${a.device_serial}</b></span><span>🌡 warmup día <b>${a.warmup_day}</b></span></div>
        <div class="row meta"><span>🛜 proxy <b>${a.proxy_id || '—'}</b></span><span>❤️ <b>${a.likes_today || 0}</b></span></div>
        <div class="actions">${botBtn}</div>
      </div>`;
    }).join('');
  } catch (e) { console.warn(e.message); }
}

async function refreshQueue() {
  try {
    queue = await api('/api/queue');
    $('queueCount').textContent = queue.length;
    $('queueBody').innerHTML = queue.slice().reverse().map(j => {
      const statusCls = ['pending','generating','publishing','published','failed','awaiting_manual_upload']
        .includes(j.status) ? j.status : 'pending';
      const video = j.video_path
        ? `<video src="/videos/${j.id}.mp4" preload="metadata"></video>` : '—';
      return `
      <tr>
        <td class="mono">${j.id}</td>
        <td>${j.keyword}</td>
        <td>${j.target_account}</td>
        <td><span class="badge ${statusCls}">${j.status}</span></td>
        <td><div class="progress"><div style="width:${j.progress || 0}%"></div></div></td>
        <td class="video-thumb">${video}</td>
      </tr>`;
    }).join('');
  } catch (e) { console.warn(e.message); }
}

// --- Acciones ---
async function toggleBot(accountId, start) {
  try {
    await api(start ? '/engagement/start' : '/engagement/stop', {
      method: 'POST', body: JSON.stringify({ account_id: accountId })
    });
    toast(start ? `Bot iniciado: ${accountId}` : `Bot detenido: ${accountId}`);
    refreshAccounts();
  } catch (e) { toast(e.message, true); }
}

async function addJob() {
  const keyword = $('kwInput').value.trim();
  if (!keyword) return toast('Escribe una keyword', true);
  try {
    await api('/api/queue', {
      method: 'POST',
      body: JSON.stringify({ keyword, target_account: $('acctSelect').value })
    });
    $('kwInput').value = '';
    toast('Job agregado a la cola');
    refreshQueue();
  } catch (e) { toast(e.message, true); }
}

async function processNext() {
  try {
    const r = await api('/api/queue/next', { method: 'POST', body: '{}' });
    toast(r.message || `Procesando ${r.id}...`);
    refreshQueue();
  } catch (e) { toast(e.message, true); }
}

// --- Consola SSE ---
function initConsole() {
  const con = $('console');
  const evt = new EventSource('/stream/logs');
  evt.onmessage = (event) => {
    if (event.data === '{}' || event.data.startsWith(':')) return;
    const line = event.data;
    const m = line.match(/^\S+ \| (INFO|WARNING|ERROR|DEBUG)/);
    const cls = m ? m[1] : 'INFO';
    const div = document.createElement('div');
    div.className = cls;
    div.textContent = line;
    con.appendChild(div);
    while (con.childNodes.length > 600) con.removeChild(con.firstChild);
    con.scrollTop = con.scrollHeight;
  };
  evt.onerror = () => {
    const div = document.createElement('div');
    div.className = 'ERROR';
    div.textContent = new Date().toLocaleTimeString() + ' | SSE desconectado — reintentando...';
    con.appendChild(div);
  };
}

// --- Ciclo de refresco ---
refreshStats(); refreshAccounts(); refreshQueue(); initConsole();
setInterval(refreshStats, 5000);
setInterval(refreshAccounts, 5000);
setInterval(refreshQueue, 5000);
</script>
</body>
</html>
