# Phone Farm Platform — orquestación Docker
#
#   platform     -> Flask API + dashboard + taktik-bot (ADB vía host)
#   moneyprinter -> MoneyPrinterTurbo API (SOLO loopback en el host: CVE-2025-7897)
#
# Uso: docker compose -f platform/docker-compose.yml up -d --build
# (o scripts/deploy.ps1, que además prepara clones, .env y config MPT)

services:
  moneyprinter:
    build:
      context: ./third_party/MoneyPrinterTurbo
      args:
        DOCKER_BUILD_MIRROR: default   # evitar espejos chinos (lentos/inaccesibles)
    image: phonefarm-moneyprinter
    container_name: phonefarm-moneyprinter
    # El CMD por defecto de la imagen arranca el WebUI Streamlit; nosotros
    # queremos la API FastAPI (main.py), que es la que consume generator.py.
    command: ["python", "main.py"]
    # Paso 8: NUNCA env_file con todo el .env — solo variables explícitas de MPT
    # (el config.toml montado ya lleva las claves; esto cubre regeneración en
    # contenedor y variables de runtime del propio MPT).
    environment:
      MPT_API_KEY: ${MPT_API_KEY:-}
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-minimax}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      MINIMAX_BASE_URL: ${MINIMAX_BASE_URL:-https://api.minimax.io/v1}
      MINIMAX_MODEL: ${MINIMAX_MODEL:-}
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      KIMI_BASE_URL: ${KIMI_BASE_URL:-}
      KIMI_MODEL: ${KIMI_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    volumes:
      # Config segura generada por scripts/gen_mpt_config.py. Se monta desde
      # MPT_CONFIG (ruta sin paréntesis: Docker Desktop falla al montar
      # archivos desde rutas con caracteres especiales; por defecto ./mpt-config.toml)
      - ${MPT_CONFIG:-./mpt-config.toml}:/MoneyPrinterTurbo/config.toml:ro
      - mpt-storage:/MoneyPrinterTurbo/storage
    expose:
      - "8080"                    # solo red interna (platform)
    ports:
      - "127.0.0.1:8080:8080"     # SOLO loopback del host
    restart: unless-stopped

  platform:
    build: .
    image: phonefarm-platform
    container_name: phonefarm-platform
    depends_on:
      - moneyprinter
    env_file:
      - .env
    environment:
      PHONE_FARM_DATA_DIR: /app/data
      MPT_API_URL: http://moneyprinter:8080
      # Docker Desktop Windows: el ADB server corre en el host; los teléfonos
      # se conectan por USB al Mini PC y se exponen vía "adb tcpip 5555".
      ADB_HOST: host.docker.internal
      ADB_PORT: "5037"
      MCP_ENABLED: "1"
      MCP_PORT: "5001"
    volumes:
      - ./data:/app/data          # accounts.json, sessions/, videos/, logs/
      - ./templates:/app/templates
    ports:
      - "127.0.0.1:${FLASK_PORT:-5000}:5000"   # dashboard + API
      - "127.0.0.1:${MCP_PORT:-5001}:5001"     # MCP server (agentes)
    restart: unless-stopped

volumes:
  mpt-storage:
