# Phone Farm Platform — orquestación Docker (paso 13: endurecido)
#
#   platform     -> Flask API + dashboard + taktik-bot (ADB vía host)
#   moneyprinter -> MoneyPrinterTurbo API (SOLO loopback en el host)
#
# Endurecimiento: usuario no-root (imagen), read_only, cap_drop ALL,
# no-new-privileges, límites de recursos, redes separadas (sin bridge
# compartido entre servicios), secretos explícitos (sin env_file con todo el
# .env), puertos loopback y healthchecks.
#
# Uso: docker compose -f platform/docker-compose.yml up -d --build
# (o scripts/deploy.ps1, que además prepara clones, .env y config MPT)

services:
  moneyprinter:
    build:
      context: ./third_party/MoneyPrinterTurbo
      args:
        DOCKER_BUILD_MIRROR: default   # evitar espejos chinos (lentos/inaccesibles)
    image: phonefarm-moneyprinter
    container_name: phonefarm-moneyprinter
    command: ["python", "main.py"]
    # Paso 13: no-root (la imagen upstream es root; python slim trae 'nobody').
    user: "nobody"
    # Paso 8: NUNCA env_file con todo el .env — solo variables explícitas de MPT
    environment:
      MPT_API_KEY: ${MPT_API_KEY:-}
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-minimax}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      MINIMAX_BASE_URL: ${MINIMAX_BASE_URL:-https://api.minimax.io/v1}
      MINIMAX_MODEL: ${MINIMAX_MODEL:-}
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      KIMI_BASE_URL: ${KIMI_BASE_URL:-}
      KIMI_MODEL: ${KIMI_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    volumes:
      - ${MPT_CONFIG:-./mpt-config.toml}:/MoneyPrinterTurbo/config.toml:ro
      - mpt-storage:/MoneyPrinterTurbo/storage
    expose:
      - "8080"                    # solo red interna mpt-net (platform)
    ports:
      - "127.0.0.1:8080:8080"     # SOLO loopback del host
    networks:
      - mpt-net
    read_only: true
    tmpfs:
      - /tmp:size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
          pids: 256
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ping', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  platform:
    build: .
    image: phonefarm-platform
    container_name: phonefarm-platform
    depends_on:
      moneyprinter:
        condition: service_healthy
    env_file:
      - .env                       # .env propio de platform (token, claves LLM, MPT_API_KEY)
    environment:
      PHONE_FARM_DATA_DIR: /app/data
      MPT_API_URL: http://moneyprinter:8080
      ADB_HOST: host.docker.internal
      ADB_PORT: "5037"
      MCP_ENABLED: "0"             # paso 7: desactivado por defecto; 1 = habilitar con tokens
      MCP_PORT: "5001"
    volumes:
      # data es ESCRITIBLE (SQLite WAL + vídeos): protegido en el host con
      # platform/scripts/lock-data-acl.ps1. En Linux host: chown -R 65534:65534 ./data
      - ./data:/app/data
      - ./templates:/app/templates:ro
    ports:
      - "127.0.0.1:${FLASK_PORT:-5000}:5000"   # dashboard + API
      - "127.0.0.1:${MCP_PORT:-5001}:5001"     # MCP server (agentes)
    networks:
      - mpt-net
    read_only: true
    tmpfs:
      - /tmp:size=256m
      - /app/tmp:size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4g
          pids: 512
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

networks:
  mpt-net:
    driver: bridge
    internal: false
    # Red ÚNICA y compartida solo entre platform y moneyprinter (aislamiento:
    # ningún otro contenedor del bridge por defecto alcanza la API MPT).

volumes:
  mpt-storage:
