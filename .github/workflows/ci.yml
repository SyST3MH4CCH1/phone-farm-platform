name: CI

on:
  push:
    branches: [main, master, develop, "feature/**", "feat/**", "codex/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.1.0
  NODE_VERSION: 22
  PYTHON_VERSION: "3.12"

# INF-12: mínimo privilegio para el GITHUB_TOKEN del workflow.
permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck + Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # better-sqlite3@13.0.3 ships prebuilds for all 7 supported platforms in
      # node_modules/better-sqlite3/prebuilds/. npm and bun default to running
      # node-gyp rebuild whenever a `binding.gyp` file is present, even though
      # better-sqlite3 sets `"gypfile": false`. We use --ignore-scripts so the
      # prebuilt binary is used directly and the install works on hosts without
      # Visual Studio Build Tools (verified in Windows + Node 22/24 and Linux).
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck
      - run: bun run lint

  build:
    name: Build (frontend + server)
    runs-on: ubuntu-latest
    needs: [typecheck]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build

  test-node:
    name: Tests Node (vitest/supertest)
    runs-on: ubuntu-latest
    needs: [typecheck]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci --ignore-scripts
      - run: npm test

  test-python:
    name: Tests Python (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r platform/requirements.txt -r platform/requirements-dev.txt
      - run: python -m pytest platform/tests -q

  audit-deps:
    name: Audit de dependencias (npm + pip)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci --ignore-scripts
      - name: npm audit (fail si hay high/critical)
        run: npm audit --audit-level=high
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: "pip-audit (INF-06: sin || true — debe bloquear)"
        run: |
          python -m pip install pip-audit
          pip-audit -r platform/requirements.txt -f json --progress-spinner off

  sast:
    name: Análisis estático (bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install bandit
      # INF-06: sin || true — los hallazgos de severidad media+ bloquean.
      - run: bandit -r platform/phonefarm -q -ll -f json

  compose-validate:
    name: Validación Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # INF-03: el servicio platform usa `env_file: .env`; en un checkout
      # fresco de CI no existe -> compose config fallaba SIEMPRE. Se siembra
      # desde .env.example antes de validar.
      - run: cp platform/.env.example platform/.env
      - run: docker compose -f platform/docker-compose.yml config -q

  lock-verify:
    name: Lock de terceros (SEC-008)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            platform/third_party.lock
            docs/THIRD-PARTY-LOCK.md
          sparse-checkout-cone-mode: false
      - name: Verificar platform/third_party.lock
        run: |
          python - <<'PY'
          from pathlib import Path
          import tomllib

          lock = tomllib.loads(Path('platform/third_party.lock').read_text(encoding='utf-8'))
          expected = {'MoneyPrinterTurbo': 'cf5a3ae'}
          for component, commit_prefix in expected.items():
              actual = lock.get(component, {}).get('commit', '')
              if not actual.startswith(commit_prefix):
                  raise SystemExit(f'LOCK MISMATCH: {component} expected {commit_prefix}')
              print(f'{component}: OK ({actual})')
          PY

  secret-scan:
    name: Secret scan (gitleaks — historial y árbol actual)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Instalar gitleaks (versión pineada)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Gitleaks — historial completo (bloqueante)
        run: gitleaks git . --config .gitleaks.toml --no-banner --redact
      - name: Gitleaks — árbol actual (bloqueante)
        run: gitleaks dir . --config .gitleaks.toml --no-banner --redact
