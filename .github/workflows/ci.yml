name: CI

on:
  push:
    branches: [main, master, develop, "feature/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.1.0
  NODE_VERSION: 22
  PYTHON_VERSION: "3.12"

# INF-12: mínimo privilegio para el GITHUB_TOKEN del workflow.
permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck + Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint

  build:
    name: Build (frontend + server)
    runs-on: ubuntu-latest
    needs: [typecheck]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run build

  test-node:
    name: Tests Node (vitest/supertest)
    runs-on: ubuntu-latest
    needs: [typecheck]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - run: npm test

  test-python:
    name: Tests Python (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r platform/requirements.txt -r platform/requirements-dev.txt
      - run: python -m pytest platform/tests -q

  audit-deps:
    name: Audit de dependencias (npm + pip)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - name: npm audit (fail si hay high/critical)
        run: npm audit --audit-level=high
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: pip-audit (INF-06: sin || true — debe bloquear)
        run: |
          python -m pip install pip-audit
          pip-audit -r platform/requirements.txt -f json --progress-spinner off

  sast:
    name: Análisis estático (bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install bandit
      # INF-06: sin || true — los hallazgos de severidad media+ bloquean.
      - run: bandit -r platform/phonefarm -q -ll -f json

  compose-validate:
    name: Validación Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # INF-03: el servicio platform usa `env_file: .env`; en un checkout
      # fresco de CI no existe -> compose config fallaba SIEMPRE. Se siembra
      # desde .env.example antes de validar.
      - run: cp platform/.env.example platform/.env
      - run: docker compose -f platform/docker-compose.yml config -q

  lock-verify:
    name: Lock de terceros (SEC-008)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            platform/third_party.lock
            docs/THIRD-PARTY-LOCK.md
          sparse-checkout-cone-mode: false
      - name: Verificar platform/third_party.lock
        run: |
          python -c "
          import re, sys
          lock = open('platform/third_party.lock').read()
          expected = {'MoneyPrinterTurbo': '254cd02', 'taktik-bot': 'c2b7489'}
          for comp, sha in expected.items():
              if not re.search(rf'^\[{comp}\].*?commit\s*=\s*[\"']?' + sha, lock, re.M | re.DOTALL):
                  print(f'LOCK MISMATCH: {comp} sha {sha} not found in platform/third_party.lock')
                  sys.exit(1)
              print(f'{comp}: OK ({sha})')
          print('platform/third_party.lock: PASS')
          "

  secret-scan:
    name: Secret scan (gitleaks — árbol actual y diff)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      # INF-04: el historial contiene 6 findings previos (4 con valores reales
      # en MANUAL.md/CurlTesterModal de commits 9da8a66/d5abdfe) que requieren
      # purga de historial (acción manual pendiente). Para no dejar el workflow
      # en rojo permanente por el PASADO, el gate bloqueante escanea el árbol
      # actual + diff del PR (log-opts), y el historial completo queda como job
      # informativo con reporte descargable.
      - name: Instalar gitleaks (versión pineada)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Gitleaks — árbol actual (bloqueante)
        run: gitleaks detect --source . --no-banner --redact
      - name: Gitleaks — diff del PR (bloqueante)
        if: github.event_name == 'pull_request'
        run: gitleaks detect --source . --no-banner --redact --log-opts="origin/${{ github.base_ref }}..HEAD"
      - name: Gitleaks — historial completo (informativo, requiere purga)
        if: always()
        continue-on-error: true
        run: gitleaks detect --source . --no-banner --redact --report-format json --report-path gitleaks-history-report.json || true
      - name: Subir reporte del historial (informativo)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-history-report
          path: gitleaks-history-report.json
          if-no-files-found: ignore
