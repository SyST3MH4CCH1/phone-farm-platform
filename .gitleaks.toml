# Gitleaks — configuración del repo Phone Farm Platform (2026-08-17)
#
# Allowlist limitada a archivos de pruebas con credenciales ficticias.
# El escaneo estricto del historial del 2026-10-05 solo detectó cinco cadenas
# fabricadas en test/redact-secrets.test.ts.
#
# Referencia: https://github.com/gitleaks/gitleaks/blob/master/README.md#gitleaks-toml

title = "Phone Farm Platform gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Credenciales ficticias en archivos de pruebas"
paths = [
  # Fixtures de autenticación: valores demo "tok-placeholder"/"tok-1234567890"
  # usados para validar que loadConfig rechaza configs débiles. Nunca secretos.
  '''test/secure-boot.test.ts''',
  '''test/helpers.ts''',
  # Casos de prueba de redactSecrets: cadenas fabricadas para probar el filtro.
  '''test/redact-secrets.test.ts''',
]
